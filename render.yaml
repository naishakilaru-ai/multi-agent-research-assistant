services:
  - type: web
    name: multi-agent-research-assistant
    runtime: python
    plan: free
    branch: gemini-migration
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11